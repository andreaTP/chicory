[package]
name = "hello-world"

[lib]
crate-type = ["cdylib"]

[dependencies]
syntastica = { version = "0.6.1", default-features = false, features = ["runtime-c2rust"] }
syntastica-parsers-git = { version = "0.6.1",default-features = false, features = ["runtime-c2rust", "rust"] }
syntastica-themes = { version = "0.6.1", default-features = false, features = ["runtime-c2rust"] }

[profile.release]
opt-level = 3
